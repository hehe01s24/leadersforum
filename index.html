<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEADERS FORUM: Agentic AI 시대 경제와 인류</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 차콜 블랙 기반의 최고급 다크 모드 테마 */
        body {
            background-color: #121212;
            color: #f1f5f9;
            font-family: 'Pretendard', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 0;
        }

        /* 세련된 추상적 로고 패턴 (워터마크) */
        .bg-texture {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            background-image: url('logo2.png');
            background-size: 150vw auto; /* 기하학적 곡선만 보이도록 초근접 줌인 */
            background-position: left center;
            background-repeat: no-repeat;
            opacity: 0.03; /* 아주 은은한 텍스처 느낌 */
            z-index: -1;
            pointer-events: none;
        }

        /* 상단 네비게이션 바 */
        .top-nav {
            display: flex;
            align-items: center;
            padding: 16px 5vw;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(79, 172, 254, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-nav img { height: 26px; }

        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        /* 딥블루 & 스카이블루 타이포그래피 */
        h1, h2, h3 { 
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #005BAC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 { font-size: 28px; margin-top: 0; line-height: 1.35; margin-bottom: 15px; text-align: center; }

        /* 히어로 섹션 */
        .hero { text-align: center; margin-bottom: 40px; }
        .hero img.main-banner {
            width: 100%; max-height: 400px; object-fit: cover; 
            border-radius: 20px; margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hero .date-badge { 
            display: inline-block; background: rgba(79, 172, 254, 0.1); 
            color: #4facfe; padding: 6px 16px; border-radius: 50px; font-size: 14px; margin-bottom: 12px;
            border: 1px solid rgba(79, 172, 254, 0.2);
        }

        /* 미니멀 글래스모피즘 카드 */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(79, 172, 254, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .glass-card h2 { 
            border-bottom: 1px solid rgba(79, 172, 254, 0.2); 
            padding-bottom: 12px; margin-top: 0; margin-bottom: 24px; font-size: 24px; 
        }

        /* 버튼 디자인 */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .slido-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            background: linear-gradient(135deg, #005BAC 0%, #4facfe 100%);
            color: #fff; font-weight: 700; font-size: 18px;
            padding: 20px; border-radius: 16px; text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 91, 172, 0.4);
        }
        .survey-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            background: rgba(79, 172, 254, 0.05);
            color: #4facfe; font-weight: 600; font-size: 17px;
            padding: 18px; border-radius: 16px; text-decoration: none;
            border: 1px solid rgba(79, 172, 254, 0.3);
        }
        .live-dot { width: 8px; height: 8px; background-color: #ff4b2b; border-radius: 50%; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 75, 43, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); }
        }

        /* 강사 프로필 */
        .profile-container { display: flex; gap: 25px; align-items: flex-start; }
        .profile-img { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 2px solid #4facfe; flex-shrink: 0; }
        .profile-text h3 { font-size: 24px; margin: 0 0 10px 0; -webkit-text-fill-color: #fff; background: none; }
        .profile-text p { margin: 5px 0; color: #cbd5e1; font-size: 15px; }
        .profile-text .bio-tag { color: #4facfe; font-weight: 600; font-size: 14px; margin-top: 15px; display: block; }

        @media (max-width: 600px) {
            .profile-container { flex-direction: column; text-align: center; align-items: center; }
            ul.timeline li { flex-direction: column; align-items: flex-start; gap: 5px; }
            ul.timeline li strong { width: 100%; }
        }
